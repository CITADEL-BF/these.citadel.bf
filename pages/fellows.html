<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'fr',
    includedLanguages: 'fr,en',
    autoDisplay: false
  }, 'google_translate_element');
}

function toggleLang() {
  var btn = document.getElementById('langBtn');
  var select = document.querySelector('.goog-te-combo');

  if (!select) return;

  if (btn.textContent === 'EN') {
    select.value = 'en';
    select.dispatchEvent(new Event('change'));
    btn.textContent = 'FR';
  } else {
    select.value = 'fr';
    select.dispatchEvent(new Event('change'));
    btn.textContent = 'EN';
  }
}

/* ── Menu hamburger mobile ── */
function toggleMenu() {
  const nav = document.getElementById('mainNav');
  const btn = document.querySelector('.menu-toggle');
  if (!nav || !btn) return;
  nav.classList.toggle('open');
  btn.classList.toggle('active');
}

// Fermer le menu au clic sur un lien
document.addEventListener('click', (e) => {
  if (e.target.closest('#mainNav a')) {
    const nav = document.getElementById('mainNav');
    const btn = document.querySelector('.menu-toggle');
    if (nav) nav.classList.remove('open');
    if (btn) btn.classList.remove('active');
  }
});
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  if (typeof netlifyIdentity === "undefined") return;
  const user = netlifyIdentity.currentUser();
  const btn = document.getElementById("btnConnexion");
  if (btn && user) {
  btn.innerHTML = `<i class="fa-solid fa-circle-user" style="font-size:1.6rem;color:white;">`;
  btn.style.background = "var(--green)";
  btn.style.padding = "5px 12px";
  btn.style.display = "flex";
  btn.style.alignItems = "center";
  btn.style.borderRadius = "4px";
}
btn.style.opacity = "1";
});
</script>
